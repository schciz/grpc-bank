services:
  postgres:
    image: postgres:16-alpine
    container_name: bank_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required, see .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see .env.example}
      ACCOUNTS_DB_NAME: ${ACCOUNTS_DB_NAME:?ACCOUNTS_DB_NAME is required, see .env.example}
      PAYMENTS_DB_NAME: ${PAYMENTS_DB_NAME:?PAYMENTS_DB_NAME is required, see .env.example}
      AUDIT_DB_NAME: ${AUDIT_DB_NAME:?AUDIT_DB_NAME is required, see .env.example}
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT is required, see .env.example}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    networks:
      - bank-network
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 2s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: bank_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required, see .env.example}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required, see .env.example}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    networks:
      - bank-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 15

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: bank_redpanda
    restart: always
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://127.0.0.1:9092
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - redpandadata:/var/lib/redpanda/data
    networks:
      - bank-network

networks:
  bank-network:
    driver: bridge

volumes:
  pgdata:
  miniodata:
  redpandadata:
